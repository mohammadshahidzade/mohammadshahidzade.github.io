<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">RTL logic resimulation pipeline</title>
  <desc id="desc">Three input registers feed four layers of AND, OR, XOR, XNOR, and NOT gates before three output registers capture the results. A bracket identifies the combinational region as resimulation on GPU.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="1" stop-color="#0d2633"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17364a"/>
      <stop offset="1" stop-color="#0b2232"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#91c7de" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#79e0ce"/>
    </marker>
  </defs>

  <rect width="1200" height="410" fill="url(#bg)"/>
  <rect width="1200" height="410" fill="url(#grid)"/>

  <g fill="none" stroke="#79e0ce" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <path d="M220 66V48H972V66"/>
  </g>
  <text x="596" y="35" fill="#79e0ce" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="3" text-anchor="middle">RESIMULATION ON GPU</text>

  <g fill="none" stroke="#71b7ff" stroke-opacity=".52" stroke-width="2.4">
    <path d="M145 141H242"/><path d="M145 205C185 205 190 275 242 275"/><path d="M145 269C190 269 195 149 424 149"/>
    <path d="M332 149H424"/><path d="M332 275C375 275 380 229 424 229"/><path d="M518 149C556 149 570 162 612 162"/>
    <path d="M518 229C560 229 570 300 612 300"/><path d="M522 323C560 323 568 300 612 300"/>
    <path d="M702 162C748 162 756 229 802 229"/><path d="M702 300C748 300 756 229 802 229"/>
    <path d="M894 229H1048"/><path d="M894 229C950 229 972 141 1048 141"/><path d="M894 229C950 229 972 269 1048 269"/>
  </g>
  <g fill="#71b7ff">
    <circle cx="202" cy="141" r="3.5"/><circle cx="383" cy="275" r="3.5"/><circle cx="565" cy="300" r="3.5"/><circle cx="960" cy="229" r="3.5"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="125" y="101" fill="#96a8b5" font-size="16" font-weight="700" letter-spacing="2" text-anchor="middle">INPUT REGISTERS</text>
    <g fill="#102b3b" stroke="#79e0ce" stroke-width="2">
      <rect x="55" y="117" width="90" height="48" rx="4"/><rect x="55" y="181" width="90" height="48" rx="4"/><rect x="55" y="245" width="90" height="48" rx="4"/>
    </g>
    <g fill="#eef4f8" font-size="17" font-weight="700" text-anchor="middle">
      <text x="100" y="147">D  |  Q</text><text x="100" y="211">D  |  Q</text><text x="100" y="275">D  |  Q</text>
    </g>
    <g fill="#71b7ff" font-size="15" text-anchor="end"><text x="45" y="147">IN₀</text><text x="45" y="211">IN₁</text><text x="45" y="275">IN₂</text></g>

    <text x="1072" y="101" fill="#96a8b5" font-size="16" font-weight="700" letter-spacing="2" text-anchor="middle">OUTPUT REGISTERS</text>
    <g fill="#102b3b" stroke="#79e0ce" stroke-width="2">
      <rect x="1048" y="117" width="96" height="48" rx="4"/><rect x="1048" y="181" width="96" height="48" rx="4"/><rect x="1048" y="245" width="96" height="48" rx="4"/>
    </g>
    <g fill="#eef4f8" font-size="17" font-weight="700" text-anchor="middle">
      <text x="1096" y="147">D  |  Q</text><text x="1096" y="211">D  |  Q</text><text x="1096" y="275">D  |  Q</text>
    </g>
  </g>

  <g fill="url(#gate)" stroke="#71b7ff" stroke-width="2.4" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <g transform="translate(242 119)"><path d="M0 0h40c35 0 50 13 50 30s-15 30-50 30H0Z"/><text x="42" y="36" fill="#eef4f8" stroke="none">AND</text></g>
    <g transform="translate(242 245)"><path d="M0 0c18 16 18 44 0 60 37 0 70-6 90-30C70 6 37 0 0 0Z"/><path d="M-7 0c18 16 18 44 0 60" fill="none"/><text x="43" y="36" fill="#eef4f8" stroke="none">XOR</text></g>

    <g transform="translate(424 119)"><path d="M0 0 72 30 0 60Z"/><circle cx="79" cy="30" r="7"/><text x="31" y="36" fill="#eef4f8" stroke="none">NOT</text></g>
    <g transform="translate(424 199)"><path d="M0 0c18 16 18 44 0 60 37 0 70-6 90-30C70 6 37 0 0 0Z"/><text x="43" y="36" fill="#eef4f8" stroke="none">OR</text></g>
    <g transform="translate(424 293)"><path d="M0 0c18 16 18 44 0 60 34 0 65-5 85-25"/><path d="M85 35c3-2 5-3 7-5-2-2-4-3-7-5"/><path d="M-7 0c18 16 18 44 0 60" fill="none"/><circle cx="94" cy="30" r="7"/><text x="42" y="36" fill="#eef4f8" stroke="none">XNOR</text></g>

    <g transform="translate(612 132)"><path d="M0 0h40c35 0 50 13 50 30s-15 30-50 30H0Z"/><text x="42" y="36" fill="#eef4f8" stroke="none">AND</text></g>
    <g transform="translate(612 270)"><path d="M0 0c18 16 18 44 0 60 37 0 70-6 90-30C70 6 37 0 0 0Z"/><path d="M-7 0c18 16 18 44 0 60" fill="none"/><text x="43" y="36" fill="#eef4f8" stroke="none">XOR</text></g>
    <g transform="translate(802 199)"><path d="M0 0c18 16 18 44 0 60 37 0 70-6 90-30C70 6 37 0 0 0Z"/><text x="43" y="36" fill="#eef4f8" stroke="none">OR</text></g>
  </g>

  <g fill="#96a8b5" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="287" y="386">LAYER 1</text><text x="470" y="386">LAYER 2</text><text x="657" y="386">LAYER 3</text><text x="847" y="386">LAYER 4</text>
  </g>
  <path d="M990 205h36" stroke="#79e0ce" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
